[package]
name = "cacheconsistency"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic local and simulated filesystem consistency auditing"
license = "MIT"
repository = "https://github.com/joshiii-xyz/cacheconsistency"
keywords = ["filesystem", "cache", "consistency", "reproducibility"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

[dev-dependencies]
serde_json = "1.0"
